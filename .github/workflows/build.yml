name: Build bootloader
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build
        run: cmake --build build
      - name: Test firmware protocol
        run: sh tests/run_firmware.sh
      - name: Test C# host protocol
        run: dotnet run --project host/KMX.Flashing.Tests/KMX.Flashing.Tests.csproj --configuration Release
      - name: Publish CLI
        run: dotnet publish host/KMX.Flashing.Cli/KMX.Flashing.Cli.csproj --configuration Release --output dist/cli
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kmx_v3
          path: build/*.bin
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: kmx-uds-cli
          path: dist/cli/
