name: Build CI
on:
  push:
  pull_request:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Set up repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: "blob:none"
        show-progress: false
        submodules: false
    - name: Set up compiler
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '13.2.Rel1'
    - name: Build
      run: make submodules && make -j$(nproc) all BOARD=kmx_v3
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kmx_v3
        path: |
          build/kmx_v3/*.bin
          build/kmx_v3/*.elf
          build/kmx_v3/*.uf2