name: Build bootloader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check submodule credential
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          if [ -z "$SUBMODULES_TOKEN" ]; then
            echo "::error::Set the SUBMODULES_TOKEN Actions secret to a token with Contents read access to V3-Bootloader, kmxcpp_v3_bootloader, and kmxcommon."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.SUBMODULES_TOKEN }}
          persist-credentials: false
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - name: Build
        run: cmake --build build
      - name: Test firmware protocol
        run: sh tests/run_firmware.sh
      - name: Test C# host protocol
        run: dotnet run --project host/KMX.Flashing.Tests/KMX.Flashing.Tests.csproj --configuration Release
      - name: Publish CLI
        run: dotnet publish host/KMX.Flashing.Cli/KMX.Flashing.Cli.csproj --configuration Release --output dist/cli
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kmx_v3
          path: build/*.bin
      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: kmx-uds-cli
          path: dist/cli/
